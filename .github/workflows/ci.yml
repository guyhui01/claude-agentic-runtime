name: CI

# Continuous validation (docs/NEXT_STEPS.md §2.5): strict typecheck + test suite.
# The tests cover schema validation (ajv: sidecar.schema + integrity) and the
# fail-closed eval gates of the ten catalog spines (WF-001 … WF-010) plus the
# WF-000 dispatch layer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancels earlier runs still in flight on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: typecheck + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Observed duration: 23-28 s. A ceiling this far above it turns a hung job
    # into a fast red instead of hours of silence.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Maintenance LTS + Active LTS. Node 20 was dropped on 2026-07-30: it
        # reached END OF LIFE on 2026-03-24, so half the matrix was spent on a
        # dead runtime while Node 24 — the Active LTS, and a version `engines`
        # claimed to support — was never exercised. `engines` moved to ">=22" in
        # the same lot: claiming support for a runtime nothing tests is the same
        # class of empty guarantee. Node 26 (Current) is the workstation's own
        # version, so it is covered by every local run.
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (clean, lockfile-faithful)
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Tests
        run: npm test

  # The job above runs WITHOUT a catalog checkout, which is deliberate (ADR-0002:
  # the runtime does not depend on the catalog repo) — so every `real-sidecar`
  # block skips cleanly there. Measured on 2026-07-29: that silently left **28
  # assertions unverified by CI** — every backbone resolution against real agent
  # prose, the plan built from the real WF-001 card, the route validated against
  # the real sidecar, and the five manifest catalog-tag comparisons.
  #
  # This job closes that, at the tag the manifests PIN — see the two comments
  # below for why the default branch was tried first and rejected, and why the
  # catalog is cloned rather than checked out with an action.
  catalog-integration:
    name: real-sidecar integration (catalog at the pinned tag)
    runs-on: ubuntu-latest
    # Same reasoning as above; this job adds a ~1 s shallow clone to the same
    # steps, and runs in PARALLEL with the matrix — so it costs runner minutes
    # (free on a public repo), not wall-clock.
    timeout-minutes: 10
    # Declared ONCE for the whole job. `REQUIRE_CATALOG` is what makes this job's
    # green mean something: it turns "skipped for lack of a catalog" into a test
    # FAILURE, so a mistyped path or a clone that silently produced nothing cannot
    # pass as success. Asserting the cloned file exists would only have proven the
    # clone — not that the tests read it.
    env:
      CATALOG_ROOT: ${{ github.workspace }}/catalog
      REQUIRE_CATALOG: "1"
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v7

      # The tag is read FROM THE CODE, never written here: a literal in this file
      # would be a second source of truth for the pin, free to drift from the
      # manifests it is supposed to mirror.
      - name: Read the catalog tag the manifests pin
        id: pin
        run: |
          tag=$(grep -oE 'catalogTag: "v[0-9]+\.[0-9]+\.[0-9]+"' src/dispatch/manifests/wf-001.ts \
                | head -1 | grep -oE 'v[0-9.]+')
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Cloned at the PINNED TAG, not at the default branch.
      #
      # `main` was the first design and it was wrong: ADR-0002 rejects a live
      # import of the catalog precisely because "a catalog edit would break the
      # runtime with no safety net", and accepts as a cost that "freshness is not
      # immediate — you must bump to propagate". Pointing this job at `main` turns
      # a catalog RELEASE into a red CI here until the manifests are re-derived,
      # converting a deliberately unhurried freshness into an urgency, and leaving
      # a standing red that hides real regressions.
      #
      # At the pinned tag the comparison is tautological only for `wf-001`, whose
      # tag was extracted above; for the other four manifests it still catches an
      # internal disagreement (falsified 2026-07-30: pinning wf-002 to v4.1.0
      # turns its assertion red). Drift against the LATEST catalog tag stays a
      # session-start fact in next_steps.md, deliberately not a CI failure.
      #
      # A plain anonymous clone, not `actions/checkout`: the action's own README
      # says `${{ github.token }}` is scoped to the current repository and is
      # silent on cross-repository PUBLIC reads. A shallow HTTPS clone of a public
      # repo needs no token at all, so the question does not arise — and it fails
      # loudly if the tag does not exist.
      - name: Clone the catalog at that tag (public, anonymous, shallow)
        run: |
          git clone --depth 1 --branch "${{ steps.pin.outputs.tag }}" \
            https://github.com/guyhui01/claude-agents.git catalog

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install (clean, lockfile-faithful)
        run: npm ci

      # The whole suite, not a `real-sidecar` filter. A substring filter is itself
      # a failure mode: rename a file out of the pattern and this job runs fewer
      # tests while staying green — the very defect it exists to close. Running
      # everything costs a few seconds and removes the mode instead of guarding it.
      #
      # No billed call can fire here: the twelve live harnesses require `LIVE_RUN`
      # in ADDITION to a catalog, the one other `*live*` file is hermetic (mocked
      # `query()`, interim sidecar), and the runner refuses `ANTHROPIC_API_KEY`.
      - name: Tests with the catalog present (real prose, real cards, real sidecar)
        run: npm test
